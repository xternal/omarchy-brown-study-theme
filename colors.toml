# Brown Study: Pavel's dark brown palette (chosen 12 October 2026 on
# Ruminator.xyz), tuned for contrast. Body text sits at 13.3:1 on the
# background and nothing goes above 14:1; every coloured text tone clears
# 7:1 (WCAG AAA), comments 5.9:1. Warm throughout: amber, not blue, marks
# the chrome.
